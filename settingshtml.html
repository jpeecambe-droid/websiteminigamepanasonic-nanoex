<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        WhackaGerm
    </title>
    <link rel="stylesheet" href="settingscss.css">
    </head>
<body>
    <section class="settings">

        <h1 class="victory">Minimum score for Victory:</h1>
        <img class="victoryadd" src="assets/plus.png" alt="victoryadd">
        <img class="victorysub" src="assets/minus.png" alt="victorysubtract">
        <h1 id="victoryscore" class="victoryscore">200</h1>
        <h1 class="grandvictory">Minimum score for Grand Victory:</h1>
        <img class="grandvictoryadd" src="assets/plus.png" alt="victoryadd">
        <img class="grandvictorysub" src="assets/minus.png" alt="victorysubtract">
        <h1 id="grandvictoryscore" class="grandvictoryscore">300</h1>
        <img src="assets/landscapeportrait.png" class="orientation">
        <h1 class="OrientationPortrait">Portrait</h1>
        <h1 class="OrientationLandscape">Landscape</h1>
    
        <h1 class="time">Time Limit:</h1>
        <h1>Time: </h1>
        <img class="timeadd" src="assets/plus.png" alt="timeadd">
        <img class="timesub" src="assets/minus.png" alt="time subtract">
        <h1 id="timelimit" class="timelimit">50</h1>
        
        <h1 class="Orientation">Orientation:  </h1>

    </section>
        <img class="backarrow" src="assets/backarrow.png" alt=""backarrow>
        <img src="assets/trashcan.png" alt="trashcan" class="clearstorage">
        <h1 class="clearstoragetxt">Cache Cleared!</h1>
    <script src="settingsjs.js"></script>
    </body>
</html>
