<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        WhackaGerm
    </title>
    <link rel="stylesheet" href="instructionstyle.css">
    </head>
<body>
    <section class="instruction">
        <h1 class="HTP">HOW TO PLAY:</h1>
        
        <div class="instructionvirus">
            <img src="assets/virus.png" alt="virus">
            <img src="assets/click.png" alt="click">
            <h1>5 PTS</h1>
        </div>

       <div class="instructionbacteria">
            <img src="assets/bacteria.png" alt="bacteria">
            <img src="assets/click.png" alt="click">
            <img src="assets/click.png" alt="click">
            <h1>15 PTS</h1>
        </div>

        <div class="instructionmold">
            <img src="assets/click.png" alt="click">
            <img src="assets/click.png" alt="click">
            <img src="assets/click.png" alt="click">
            <img src="assets/mold.png" alt="mold">
            <h1>25 PTS</h1>
        </div>

        <div class="time">
            <img src="assets/time.gif" alt="time">
            <h1 id="timelimit">50</h1>
            <h1>SECONDS</h1>
        </div>


        <div class="victoryscreen">
            <img src="assets/victoryscreen.gif" alt="victoryscreen">
            <h1 id="victoryscore">200</h1>
            <h1>POINTS</h1>
        </div>
        
        <div class="grandvictory">
            <img src="assets/grandvictory.gif" alt="grandvictory">
            <h1 id="grandvictoryscore">300</h1>
            <h1>POINTS</h1>
        </div>
    </section>


        <div  id="countdowntimer" class="countdown">03</div>  
        <img class="backarrow" src="assets/backarrow.png" alt=""backarrow>
        <img class="frontarrow" src="assets/backarrow.png" alt=""backarrow>

    <script src="instruction.js"></script>
    </body>
</html>
