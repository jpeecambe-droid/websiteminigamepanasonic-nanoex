<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhackaGerm</title>
    <link rel="stylesheet" href="gamestyle.css">
    </head>
<body>
    <img src="assets/backarrow.png" alt="backarrow" class="backarrow">
    <img src="assets/scoreframe.png" alt="scoreframe" class="scorebg">
    <div class="score">
        
        <h1 id="score" class="score">
            0
        </h1>
    </div>
    
    <div class="timer">
        <img src="assets/time.gif" alt="time">
        <h1 id="timer" class="timer">
            50
        </h1>
    </div>

    <section class="gamespace" id="gamespace">
    <img src="assets/nanoex.png" class="Nanoex">
    <img src="assets/grandvictory.gif" class="grandvictory">
    <img src="assets/victoryscreen.gif" class="victoryscreen">
    <img src="assets/timesup.gif" alt="timesup" class="timesup">

    </div>
    </section>
    <script src="gamescript.js"></script>
    </body>
</html>
